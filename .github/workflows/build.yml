name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['.github/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "My App"
  APP_PKG: "com.myapp.html"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare web files
        run: |
          if [ ! -f index.html ]; then
            first=$(ls *.html 2>/dev/null | head -1 || true)
            if [ -z "$first" ]; then echo "ارفع ملف index.html اولا"; exit 1; fi
            cp "$first" index.html
          fi
          W=_apk/app/src/main/assets/www
          mkdir -p "$W"
          rsync -a --exclude='.git' --exclude='.github' --exclude='_apk' ./ "$W/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: |
          cd _apk
          PKG="$APP_PKG"
          JD="app/src/main/java/$(echo "$PKG" | tr . /)"
          mkdir -p "$JD"
          ICON=""
          if [ -f ../icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp ../icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            ICON='android:icon="@mipmap/ic_launcher"'
          fi

          cat > settings.gradle <<EOT
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "app"
          include ':app'
          EOT

          cat > build.gradle <<EOT
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT

          cat > app/build.gradle <<EOT
          plugins { id 'com.android.application' }
          android {
            namespace '$PKG'
            compileSdk 34
            defaultConfig {
              applicationId '$PKG'
              minSdk 21
              targetSdk 34
              versionCode $GITHUB_RUN_NUMBER
              versionName '1.$GITHUB_RUN_NUMBER'
            }
          }
          EOT

          cat > app/src/main/AndroidManifest.xml <<EOT
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="$APP_NAME" $ICON android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT

          cat > "$JD/MainActivity.java" <<EOT
          package $PKG;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  if (r.getUrl().getScheme().equals("file")) return false;
                  startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl()));
                  return true;
                }
              });
              w.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOT

      - name: Build APK
        working-directory: _apk
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FN="$(echo "$APP_NAME" | tr ' ' '_').apk"
          cp _apk/app/build/outputs/apk/debug/app-debug.apk "$FN"
          gh release create "build-${{ github.run_number }}" "$FN" \
            --title "$APP_NAME #${{ github.run_number }}" \
            --notes "APK جاهز للتثبيت"
